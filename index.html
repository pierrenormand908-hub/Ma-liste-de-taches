<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Liste de tâches</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="Taches.png">

    <style>
/* Fond de la page (occupe tout l'écran) */
body {
    background-color: #e5e5e5;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
}

/* L'application prend de force tout l'écran de l'iPhone */
.iphone {
    width: 100%;
    height: 100%;
    margin: 0;
    
    /* Image de fond */
    background-image: url("https://images.unsplash.com/photo-1506784983877-45594efa4cbe?q=80&w=1000&auto=format&fit=crop");
    background-color: rgba(255, 255, 255, 0.75); 
    background-blend-mode: overlay; 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    border-radius: 0; 
    padding: 60px 20px 30px 20px; 
    box-sizing: border-box;
    position: relative;
    
    display: flex;
    flex-direction: column;
}

/* Titre en ORANGE */
h1 {
    text-align: center;
    color: #e66400;
    margin-bottom: 15px;
    text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.4);
}

/* Conteneur pour ranger la saisie sur une seule ligne */
.zone-saisie {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    width: 100%;
    margin-bottom: 20px;
    flex-shrink: 0;
}

.champ-saisie {
    padding: 10px;
    font-size: 15px;
    border: 2px solid #ccc;
    border-radius: 10px;
    box-sizing: border-box; 
    height: 41px; 
}

#inputTache {
    flex-grow: 2; 
    width: 130px;
    font-size: 15px;
}

#inputDate {
    width: 45px; 
    cursor: pointer;
    background-color: white;
    background-image: url('https://cdn-icons-png.flaticon.com/512/747/747310.png');
    background-size: 22px; 
    background-repeat: no-repeat;
    background-position: center;
    color: transparent;
}

#inputDate::-webkit-datetime-edit {
    color: transparent;
}

.champ-saisie:focus {
    border-color: #007aff;
    outline: none;
    box-shadow: 0 0 8px rgba(0, 122, 255, 0.3);
}

/* LE BOUTON AJOUTER */
#btnAjouter {
    position: relative;
    cursor: pointer;
    padding: 0; 
    border: 1px solid #003da1; 
    border-radius: 10px;        
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    width: 75px;
    height: 41px;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
    box-shadow:
        inset 0px 4px 4px -3px #fff8,
        inset 0px -3px 4px -3px #fff;
    background: linear-gradient(#b3d7ff, #007aff 50%, #004b75 50%);
    isolation: isolate;
    transition: 0.25s all, 0.1s background-position;
    display: flex;
    align-items: center;
    justify-content: center;
}

#btnAjouter::after {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    border-radius: 9px;
    background: radial-gradient(circle at 50% 150%, #48b9ef, #0000 50%);
    background-size: 300% 50%;
    background-position: 50% 100%;
    background-repeat: no-repeat;
    opacity: 0;
    transition: inherit;
}

#btnAjouter::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    border-radius: 9px;
    background: radial-gradient(circle at 50% 320%, #48b9ef, #0000 50%);
    background-size: 300% 50%;
    background-position: 50% 0%;
    background-repeat: no-repeat;
    opacity: 0;
    transition: inherit;
}

#btnAjouter:hover {
    box-shadow: inset 0px 4px 4px -3px #fff9, inset 0px -3px 4px -3px #fff;
}
#btnAjouter:hover::before, #btnAjouter:hover::after { opacity: 1; }
#btnAjouter:active::before, #btnAjouter:active::after { opacity: 0; }

#btnAjouter:active {
    box-shadow:
        inset 0px 4px 4px -3px #000,
        inset 0px -4px 4px -3px #000c,
        inset 0px 0px 24px -3px #000a;
    background-position: 1px 1px;
}

#btnAjouter div { transition: 0.1s translate; }
#btnAjouter:active div { translate: 1px 1px; }

/* LA ZONE DE LISTE SCROLLABLE */
#liste {
    text-align: left;
    margin-top: 10px;
    flex: 1; 
    overflow-y: auto; 
    padding-right: 5px; 
}

#liste::-webkit-scrollbar {
    width: 4px;
}
#liste::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 4px;
}

/* CARTE DE TÂCHE */
.tache {
    display: flex;
    flex-direction: column;
    width: 100%;
    margin: 0 0 10px 0; 
    background-color: rgba(255, 255, 255, 0.55); 
    backdrop-filter: blur(8px); 
    -webkit-backdrop-filter: blur(8px);
    padding: 10px 12px; 
    border-radius: 12px; 
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    box-sizing: border-box;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.tache-ligne-principale {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 10px;
}

.tache:hover {
    transform: translateY(-2px); 
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); 
}

.date-tache {
    font-size: 12px;        
    color: #007aff;        
    font-weight: bold;      
}

.btn-supprimer {
    position: relative;
    cursor: pointer;
    padding: 6px 12px;
    border: 1px solid #5a0000; 
    border-radius: 6px;        
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    width: auto;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
    box-shadow:
        inset 0px 4px 4px -3px #fffa,
        inset 0px -3px 4px -3px #fff;
    background: linear-gradient(#ffb3b3, #ff2b2b 50%, #990000 50%);
    isolation: isolate;
    transition: 0.25s all, 0.1s background-position;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.btn-supprimer::after {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    border-radius: 5px;
    background: radial-gradient(circle at 50% 150%, #ff8080, #0000 50%);
    background-size: 300% 50%;
    background-position: 50% 100%;
    background-repeat: no-repeat;
    opacity: 0;
    transition: inherit;
}
.btn-supprimer::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    border-radius: 5px;
    background: radial-gradient(circle at 50% 320%, #ff8080, #0000 50%);
    background-size: 300% 50%;
    background-position: 50% 0%;
    background-repeat: no-repeat;
    opacity: 0;
    transition: inherit;
}

.btn-supprimer:hover {
    box-shadow: inset 0px 4px 4px -3px #fff9, inset 0px -3px 4px -3px #fff;
}
.btn-supprimer:hover::before, .btn-supprimer:hover::after { opacity: 1; }
.btn-supprimer:active::before, .btn-supprimer:active::after { opacity: 0; }

.btn-supprimer:active {
    box-shadow: inset 0px 4px 4px -3px #000, inset 0px -4px 4px -3px #000c, inset 0px 0px 24px -3px #000a;
    background-position: 1px 1px;
}
.btn-supprimer div { transition: 0.1s translate; }
.btn-supprimer:active div { translate: 1px 1px; }

.tache input[type="checkbox"]:checked + .contenu-tache {
    text-decoration: line-through;
    color: #707070;
    font-style: italic;
}

.tache input[type="checkbox"]:checked + .contenu-tache .date-tache {
    color: #707070;
}

/* BANDE ÉCHÉANCE AVEC EMOJI IPHONE */
.bande-echeance {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid rgba(0, 0, 0, 0.1);
    font-size: 13px;
    font-weight: bold;
    color: #333;
}

.emoji-echeance {
    font-size: 16px;
    line-height: 1;
}
    </style>
</head>

<body>
<div class="iphone">
    <div class="barre-haut"></div>

    <h1>Ma liste de Taches</h1>

    <div class="zone-saisie">
        <input type="text" id="inputTache" class="champ-saisie" placeholder="Écris une tâche">
        <input type="datetime-local" id="inputDate" class="champ-saisie">
        <button id="btnAjouter"><div>Ajouter</div></button>
    </div>

    <div id="liste"></div>
</div>

<script>
window.addEventListener("DOMContentLoaded", function() {
    
    let tachesData = JSON.parse(localStorage.getItem("mesTachesData")) || [];
    
    let boutonAjouter = document.getElementById("btnAjouter");
    let inputTache = document.getElementById("inputTache");
    let inputDate = document.getElementById("inputDate");

    function sauvegarderEtAfficher() {
        localStorage.setItem("mesTachesData", JSON.stringify(tachesData));
        afficherTaches();
    }

    boutonAjouter.addEventListener("click", function() {
        let texte = inputTache.value;
        let dateChoisie = inputDate.value;

        if (texte.trim() === "") return;

        let cleDate = dateChoisie !== "" ? dateChoisie : "9999-12-31";

        tachesData.push({
            id: Date.now(),
            texte: texte,
            date: dateChoisie,
            cleTri: cleDate,
            cochee: false
        });

        sauvegarderEtAfficher();
        
        inputTache.value = "";
        inputDate.value = "";
    });

    // Génère le HTML pour la bande au bas de la carte avec les emojis iOS
    function obtenirHtmlBandeEcheance(dateStr) {
        if (!dateStr || dateStr === "") return "";

        let aujourdhui = new Date();
        aujourdhui.setHours(0, 0, 0, 0);

        let dateCompare = new Date(dateStr);
        dateCompare.setHours(0, 0, 0, 0);

        let diffTemps = dateCompare - aujourdhui;
        let diffJours = Math.round(diffTemps / (1000 * 60 * 60 * 24));

        let emoji = "";
        let message = "";

        if (diffJours < 0) {
            emoji = "⚪";
            message = "Rendez-vous passé";
        } else if (diffJours === 0) {
            emoji = "🔴";
            message = "C'est aujourd'hui ton rendez-vous !";
        } else if (diffJours <= 7) {
            emoji = "🟠";
            message = `Dans ${diffJours} jour${diffJours > 1 ? 's' : ''} ton rendez-vous`;
        } else if (diffJours <= 15) {
            emoji = "🟡";
            message = `Dans ${diffJours} jours ton rendez-vous`;
        } else {
            emoji = "🟢";
            message = `Dans ${diffJours} jours ton rendez-vous`;
        }

        return `
            <div class="bande-echeance">
                <span class="emoji-echeance">${emoji}</span>
                <span>${message}</span>
            </div>
        `;
    }

    function afficherTaches() {
        let zone = document.getElementById("liste");
        zone.innerHTML = "";

        tachesData.sort((a, b) => a.cleTri.localeCompare(b.cleTri));

        tachesData.forEach((tache) => {
            let bloc = document.createElement("div");
            bloc.className = "tache";

            let dateFormatee = "";
            if (tache.date && tache.date !== "") {
                let dateChoisie = new Date(tache.date);
                let optionsDate = { day: 'numeric', month: 'short', year: 'numeric' };
                let jourMoisAnnee = dateChoisie.toLocaleDateString('fr-CA', optionsDate);
                let optionsHeure = { hour: '2-digit', minute: '2-digit' };
                let heureMinutes = dateChoisie.toLocaleTimeString('fr-CA', optionsHeure);
                
                dateFormatee = jourMoisAnnee + " à " + heureMinutes;
            } else {
                dateFormatee = "Pas de moment prévu";
            }

            let htmlBande = obtenirHtmlBandeEcheance(tache.date);

            bloc.innerHTML = `
                <div class="tache-ligne-principale">
                    <input type="checkbox" ${tache.cochee ? 'checked' : ''}>
                    <span class="contenu-tache" style="display: flex; flex-direction: column; flex-grow: 1; margin-left: 10px;">
                        <span class="date-tache" style="font-size: 12px; margin-bottom: 2px;">${dateFormatee}</span>
                        <span class="texte-tache" style="font-size: 16px; font-weight: 500; color: #333;">${tache.texte}</span>
                    </span>
                    <button class="btn-supprimer"><div>Supprimer</div></button>
                </div>
                ${htmlBande}
            `;

            let checkbox = bloc.querySelector('input[type="checkbox"]');
            checkbox.addEventListener("change", function() {
                tache.cochee = checkbox.checked;
                localStorage.setItem("mesTachesData", JSON.stringify(tachesData));
            });

            bloc.querySelector(".btn-supprimer").addEventListener("click", function() {
                tachesData = tachesData.filter(t => t.id !== tache.id);
                sauvegarderEtAfficher();
            });

            zone.appendChild(bloc);
        });
    }

    afficherTaches();
});
</script>

</body>
</html>
