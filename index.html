<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Liste de tâches</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="Taches.png">

    <style>
/* Fond de la page (occupe tout l'écran) */
body {
    background-color: #e5e5e5;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
}

/* L'application prend de force tout l'écran de l'iPhone */
.iphone {
    width: 100%;
    height: 100%;
    margin: 0;
    
    /* Image de fond */
    background-image: url("https://images.unsplash.com/photo-1506784983877-45594efa4cbe?q=80&w=1000&auto=format&fit=crop");
    background-color: rgba(255, 255, 255, 0.75); 
    background-blend-mode: overlay; 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    border-radius: 0; 
    padding: 60px 20px 30px 20px; 
    box-sizing: border-box;
    position: relative;
    
    display: flex;
    flex-direction: column;
}

/* Titre en ORANGE */
h1 {
    text-align: center;
    color: #e66400;
    margin-bottom: 10px;
    text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.4);
}

/* Bouton pour activer les notifications */
#btnNotif {
    background: rgba(0, 122, 255, 0.15);
    border: 1px solid #007aff;
    color: #007aff;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    margin: 0 auto 15px auto;
    display: block;
}

/* Conteneur pour ranger la saisie sur une seule ligne */
.zone-saisie {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    width: 100%;
    margin-bottom: 20px;
    flex-shrink: 0;
}

.champ-saisie {
    padding: 10px;
    font-size: 15px;
    border: 2px solid #ccc;
    border-radius: 10px;
    box-sizing: border-box; 
    height: 41px; 
}

#inputTache {
    flex-grow: 2; 
    width: 130px;
    font-size: 15px;
}

#inputDate {
    width: 45px; 
    cursor: pointer;
    background-color: white;
    background-image: url('https://cdn-icons-png.flaticon.com/512/747/747310.png');
    background-size: 22px; 
    background-repeat: no-repeat;
    background-position: center;
    color: transparent;
}

#inputDate::-webkit-datetime-edit {
    color: transparent;
}

.champ-saisie:focus {
    border-color: #007aff;
    outline: none;
    box-shadow: 0 0 8px rgba(0, 122, 255, 0.3);
}

/* LE BOUTON AJOUTER */
#btnAjouter {
    position: relative;
    cursor: pointer;
    padding: 0; 
    border: 1px solid #003da1; 
    border-radius: 10px;       
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    width: 75px;
    height: 41px;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
    box-shadow:
        inset 0px 4px 4px -3px #fff8,
        inset 0px -3px 4px -3px #fff;
    background: linear-gradient(#b3d7ff, #007aff 50%, #004b75 50%);
    isolation: isolate;
    transition: 0.25s all, 0.1s background-position;
    display: flex;
    align-items: center;
    justify-content: center;
}

#btnAjouter::after {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    border-radius: 9px;
    background: radial-gradient(circle at 50% 150%, #48b9ef, #0000 50%);
    background-size: 300% 50%;
    background-position: 50% 100%;
    background-repeat: no-repeat;
    opacity: 0;
    transition: inherit;
}

#btnAjouter::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    border-radius: 9px;
    background: radial-gradient(circle at 50% 320%, #48b9ef, #0000 50%);
    background-size: 300% 50%;
    background-position: 50% 0%;
    background-repeat: no-repeat;
    opacity: 0;
    transition: inherit;
}

#btnAjouter:hover {
    box-shadow: inset 0px 4px 4px -3px #fff9, inset 0px -3px 4px -3px #fff;
}
#btnAjouter:hover::before, #btnAjouter:hover::after { opacity: 1; }
#btnAjouter:active::before, #btnAjouter:active::after { opacity: 0; }

#btnAjouter:active {
    box-shadow:
        inset 0px 4px 4px -3px #000,
        inset 0px -4px 4px -3px #000c,
        inset 0px 0px 24px -3px #000a;
    background-position: 1px 1px;
}

#btnAjouter div { transition: 0.1s translate; }
#btnAjouter:active div { translate: 1px 1px; }

/* LA ZONE DE LISTE SCROLLABLE */
#liste {
    text-align: left;
    margin-top: 10px;
    flex: 1; 
    overflow-y: auto; 
    padding-right: 5px; 
}

#liste::-webkit-scrollbar {
    width: 4px;
}
#liste::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 4px;
}

.tache {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin: 0 0 10px 0; 
    gap: 10px;
    background-color: rgba(255, 255, 255, 0.40); 
    backdrop-filter: blur(8px); 
    -webkit-backdrop-filter: blur(8px);
    padding: 10px; 
    border-radius: 12px; 
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    box-sizing: border-box;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.tache:hover {
    transform: translateY(-3px); 
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); 
}

.tache span {
    flex-grow: 1; 
}      

.date-tache {
    font-size: 13px;       
    color: #007aff;       
    font-weight: bold;     
}

.btn-supprimer {
    position: relative;
    cursor: pointer;
    padding: 6px 12px;
    border: 1px solid #5a0000; 
    border-radius: 6px;       
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    width: auto;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
    box-shadow:
        inset 0px 4px 4px -3px #fffa,
        inset 0px -3px 4px -3px #fff;
    background: linear-gradient(#ffb3b3, #ff2b2b 50%, #990000 50%);
    isolation: isolate;
    transition: 0.25s all, 0.1s background-position;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-supprimer::after {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    border-radius: 5px;
    background: radial-gradient(circle at 50% 150%, #ff8080, #0000 50%);
    background-size: 300% 50%;
    background-position: 50% 100%;
    background-repeat: no-repeat;
    opacity: 0;
    transition: inherit;
}
.btn-supprimer::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    border-radius: 5px;
    background: radial-gradient(circle at 50% 320%, #ff8080, #0000 50%);
    background-size: 300% 50%;
    background-position: 50% 0%;
    background-repeat: no-repeat;
    opacity: 0;
    transition: inherit;
}

.btn-supprimer:hover {
    box-shadow: inset 0px 4px 4px -3px #fff9, inset 0px -3px 4px -3px #fff;
}
.btn-supprimer:hover::before, .btn-supprimer:hover::after { opacity: 1; }
.btn-supprimer:active::before, .btn-supprimer:active::after { opacity: 0; }

.btn-supprimer:active {
    box-shadow: inset 0px 4px 4px -3px #000, inset 0px -4px 4px -3px #000c, inset 0px 0px 24px -3px #000a;
    background-position: 1px 1px;
}
.btn-supprimer div { transition: 0.1s translate; }
.btn-supprimer:active div { translate: 1px 1px; }

.tache input[type="checkbox"]:checked + .contenu-tache {
    text-decoration: line-through;
    color: #707070;
    font-style: italic;
}

.tache input[type="checkbox"]:checked + .contenu-tache .date-tache {
    color: #707070;
}
    </style>
</head>

<body>
<div class="iphone">
    <div class="barre-haut"></div>

    <h1>Ma liste de Taches</h1>

   <button id="btnNotif" onclick="demanderPermissionNotif()">🔔 Activer les rappels</button>

    <div class="zone-saisie">
        <input type="text" id="inputTache" class="champ-saisie" placeholder="Écris une tâche">
        <input type="datetime-local" id="inputDate" class="champ-saisie">
        <button id="btnAjouter"><div>Ajouter</div></button>
    </div>

    <div id="liste"></div>
</div>

<script>
window.addEventListener("DOMContentLoaded", function () {

    // Enregistrement du Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker prêt !'))
            .catch(err => console.log('Erreur Service Worker :', err));
    }

    // 1. Masquer le bouton si déjà activé
    if (localStorage.getItem("rappelsActives") === "true") {
        let btn = document.getElementById("btnNotif");
        if (btn) btn.style.display = "none";
    }

    // 2. Permission des notifications iOS
    window.demanderPermissionNotif = function () {
        if (!("Notification" in window)) {
            alert("Ajoute d'abord l'app sur l'écran d'accueil via Safari.");
            return;
        }

        Notification.requestPermission().then(function (permission) {
            if (permission === "granted") {
                alert("Rappels activés avec succès !");
                localStorage.setItem("rappelsActives", "true");
                let btn = document.getElementById("btnNotif");
                if (btn) btn.style.display = "none";
            } else if (permission === "denied") {
                alert("Permission refusée. Vérifie dans Réglages > Notifications.");
            }
        });
    };

    let tachesData = JSON.parse(localStorage.getItem("mesTachesData")) || [];

    let boutonAjouter = document.getElementById("btnAjouter");
    let inputTache = document.getElementById("inputTache");
    let inputDate = document.getElementById("inputDate");

    function sauvegarderEtAfficher() {
        localStorage.setItem("mesTachesData", JSON.stringify(tachesData));
        afficherTaches();
    }

    // Programmer une notification Web
    function programmerNotifNative(id, texte, dateIso) {
        if ("Notification" in window && Notification.permission === "granted") {
            let dateCible = new Date(dateIso).getTime();
            let maintenant = new Date().getTime();
            let delai = dateCible - maintenant;

            if (delai > 0 && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({
                    type: 'PROGRAMMER_NOTIF',
                    id: id,
                    texte: texte,
                    delai: delai
                });
            }
        }
    }

    // Vérifier les rappels manqués pendant que l'app était fermée
    function verifierRappelsRates() {
        let maintenant = new Date().getTime();
        tachesData.forEach(tache => {
            if (tache.date && !tache.cochee && !tache.notifiee) {
                let dateTache = new Date(tache.date).getTime();
                if (maintenant >= dateTache) {
                    // Afficher la notification à l'ouverture
                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("Rappel manqué !", {
                            body: tache.texte
                        });
                    }
                    tache.notifiee = true; // Évite de re-notifier à chaque ouverture
                }
            }
        });
        localStorage.setItem("mesTachesData", JSON.stringify(tachesData));
    }

    boutonAjouter.addEventListener("click", function () {
        let texte = inputTache.value;
        let dateChoisie = inputDate.value;

        if (texte.trim() === "") return;

        let idUnique = Date.now();
        let cleDate = dateChoisie !== "" ? dateChoisie : "9999-12-31";

        let nouvelleTache = {
            id: idUnique,
            texte: texte,
            date: dateChoisie,
            cleTri: cleDate,
            cochee: false,
            notifiee: false
        };

        tachesData.push(nouvelleTache);
        sauvegarderEtAfficher();

        if (dateChoisie !== "") {
            programmerNotifNative(idUnique, texte, dateChoisie);
        }

        inputTache.value = "";
        inputDate.value = "";
    });

    function afficherTaches() {
        let zone = document.getElementById("liste");
        zone.innerHTML = "";

        tachesData.sort((a, b) => a.cleTri.localeCompare(b.cleTri));

        tachesData.forEach((tache) => {
            let bloc = document.createElement("div");
            bloc.className = "tache";

            let dateFormatee = "";
            let estEnRetard = false;

            if (tache.date && tache.date !== "") {
                let dateChoisie = new Date(tache.date);
                if (dateChoisie.getTime() < Date.now() && !tache.cochee) {
                    estEnRetard = true;
                }
                let optionsDate = { day: 'numeric', month: 'short' };
                let jourMois = dateChoisie.toLocaleDateString('fr-CA', optionsDate);
                let optionsHeure = { hour: '2-digit', minute: '2-digit' };
                let heureMinutes = dateChoisie.toLocaleTimeString('fr-CA', optionsHeure);

                dateFormatee = jourMois + " à " + heureMinutes;
            } else {
                dateFormatee = "Pas de moment prévu";
            }

            bloc.innerHTML = `
                <input type="checkbox" ${tache.cochee ? 'checked' : ''}>
                <span class="contenu-tache" style="display: flex; flex-direction: column; flex-grow: 1; margin-left: 10px;">
                    <span class="date-tache" style="font-size: 12px; margin-bottom: 2px; ${estEnRetard ? 'color: #d9534f; font-weight: bold;' : ''}">
                        ${dateFormatee} ${estEnRetard ? '⚠️ (Échue)' : ''}
                    </span>
                    <span class="texte-tache" style="font-size: 16px; font-weight: 500; color: #333;">${tache.texte}</span>
                </span>
                <button class="btn-supprimer"><div>Supprimer</div></button>
            `;

            let checkbox = bloc.querySelector('input[type="checkbox"]');
            checkbox.addEventListener("change", function () {
                tache.cochee = checkbox.checked;
                localStorage.setItem("mesTachesData", JSON.stringify(tachesData));
                afficherTaches();
            });

            bloc.querySelector(".btn-supprimer").addEventListener("click", function () {
                tachesData = tachesData.filter(t => t.id !== tache.id);
                sauvegarderEtAfficher();
            });

            zone.appendChild(bloc);
        });
    }

    // Lancement au démarrage
    afficherTaches();
    verifierRappelsRates();
});
</script>
</body>
</html>
